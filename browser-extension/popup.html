<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfferShield</title>
<style>
body{font:14px system-ui,sans-serif;width:300px;margin:0;padding:18px;color:#172033;background:#f7f8fb}
h1{font-size:18px;margin:0 0 5px}p{color:#647086;line-height:1.5;font-size:12px}
button,a{display:block;width:100%;box-sizing:border-box;border:0;border-radius:9px;padding:11px 12px;margin-top:9px;text-align:center;font-weight:650;text-decoration:none}
button{background:#3459d5;color:white;cursor:pointer}a{background:white;border:1px solid #dfe4ed;color:#263249}
#status{min-height:18px;font-size:11px}
</style>
</head>
<body>
<h1>OfferShield</h1>
<p>Capture the current job or recruitment page URL, then review it in OfferShield. The extension does not scrape private profiles or automatically label a listing fraudulent.</p>
<button id="copy">Copy current page details</button>
<a href="https://ambkeshwargupta.github.io/OfferShield/" target="_blank" rel="noopener">Open OfferShield</a>
<p id="status" role="status"></p>
<script src="popup.js"></script>
</body>
</html>
