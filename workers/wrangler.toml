name = "offershield-intelligence"
main = "api.js"
compatibility_date = "2026-11-08"
workers_dev = true

[vars]
APP_NAME = "OfferShield Intelligence API"
DATA_GOV_UDYAM_RESOURCE_ID = "8b68ae56-84cf-4728-a0a6-1be11028dea7"
DATA_GOV_API_BASE_URL = "https://www.data.gov.in/backend/dataapi/v1/resource/"
ALLOWED_ORIGINS = "https://ambkeshwargupta.github.io,http://localhost:3000,http://127.0.0.1:3000"


# Store DATA_GOV_API_KEY as a Worker secret, never in this file:
# npx wrangler secret put DATA_GOV_API_KEY

[triggers]
crons = ["15 3 * * *"]

# National MCA token index stored as compact gzip shards in R2.
[[r2_buckets]]
binding = "COMPANY_INDEX"
bucket_name = "offershield-company-index"

# Workers AI powers screenshot/PDF parsing and structured internship/offer analysis.
[ai]
binding = "AI"
[[d1_databases]]
binding = "DB"
database_name = "offershield-intelligence"
database_id = "a2a5b5e8-9a49-42df-a1d7-61a916725a3c"
