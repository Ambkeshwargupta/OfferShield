name: Deploy OfferShield intelligence Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/api.js"
      - "workers/intelligence-core.js"
      - "workers/fraud-patterns.js"
      - "workers/schema.sql"
      - "workers/migrations/**"
      - "scripts/ensure-cloudflare-d1.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: offershield-worker-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATA_GOV_API_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Add the following repository Actions secrets before deployment: ${missing[*]}"
            echo "Open https://github.com/Ambkeshwargupta/OfferShield/settings/secrets/actions"
            echo "CLOUDFLARE_API_TOKEN: Cloudflare account API token with Workers Scripts Edit permission (and R2 permissions for the configured R2 binding)."
            echo "CLOUDFLARE_ACCOUNT_ID: Cloudflare account ID."
            echo "DATA_GOV_API_KEY: data.gov.in API key."
            exit 1
          fi
          echo "All required deployment secrets are present (values are not printed)."
      - name: Install Wrangler
        run: npm install --global wrangler@latest
      - name: Provision or reuse the Community Intelligence D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-cloudflare-d1.mjs
      - name: Apply OfferShield D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is exported by ensure-cloudflare-d1.mjs from the verified dashboard account.
        run: wrangler d1 execute offershield-intelligence --remote --file=workers/schema.sql --yes --config workers/wrangler.toml
      - name: Save the D1 binding in the repository
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- workers/wrangler.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workers/wrangler.toml
            git commit -m "Configure Cloudflare D1 binding for OfferShield"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is exported by ensure-cloudflare-d1.mjs from the verified dashboard account.
        run: wrangler whoami
      - name: Confirm R2 bucket prerequisite
        run: |
          echo "The R2 bucket offershield-company-index must already exist. Create it in Cloudflare Dashboard → R2 before deployment."
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is exported by ensure-cloudflare-d1.mjs from the verified dashboard account.
        run: wrangler deploy --config workers/wrangler.toml
      - name: Set MCA API key as Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is exported by ensure-cloudflare-d1.mjs from the verified dashboard account.
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: printf '%s' "$DATA_GOV_API_KEY" | wrangler secret put DATA_GOV_API_KEY --config workers/wrangler.toml
      - name: Set optional public-web search key
        shell: bash
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is exported by ensure-cloudflare-d1.mjs from the verified dashboard account.
        run: |
          set -euo pipefail
          if [ -n "${TAVILY_API_KEY:-}" ]; then
            printf '%s' "$TAVILY_API_KEY" | wrangler secret put TAVILY_API_KEY --config workers/wrangler.toml
            echo "Tavily public-web search secret configured."
          else
            echo "TAVILY_API_KEY is not set; automatic public-web research will remain disabled."
          fi
      - name: Verify live Worker, AI and Community Intelligence
        shell: bash
        env:
          WORKER_URL: https://offershield-intelligence.official-ambkeshwargupta.workers.dev
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const url = process.env.WORKER_URL + "/v1/health";
            const response = await fetch(url);
            const data = await response.json();
            console.log(JSON.stringify({
              status:response.status,
              service:data.service,
              version:data.version,
              webSearchConfigured:data.webSearchConfigured,
              aiConfigured:data.aiConfigured,
              documentConversionConfigured:data.documentConversionConfigured,
              d1Configured:data.d1Configured,
              communityIntelligenceConfigured:data.communityIntelligenceConfigured,
              companyIndexConfigured:data.companyIndexConfigured
            }, null, 2));
            if (!response.ok || !data.ok || !data.aiConfigured || !data.documentConversionConfigured || !data.d1Configured || !data.communityIntelligenceConfigured) {
              throw new Error("Worker is deployed but one or more required bindings/schema checks are not ready.");
            }
          '
