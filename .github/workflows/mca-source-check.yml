name: MCA data source check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/mca-api-check.mjs"
      - "scripts/mca-download.mjs"
      - ".github/workflows/mca-source-check.yml"

permissions:
  contents: read

jobs:
  check-mca-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official MCA data.gov.in API
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: node scripts/mca-api-check.mjs
      - name: Download a 1,000-record MCA sample and measure size
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          node scripts/mca-download.mjs --max-records=1000 --page-size=1000 --delay-ms=0
          node -e 'const fs=require("fs"); const p=".data/mca/company-master.ndjson"; const lines=fs.readFileSync(p,"utf8").trim().split(/\r?\n/).filter(Boolean); const bytes=fs.statSync(p).size; console.log(JSON.stringify({sampleRecords:lines.length,bytes,averageBytesPerRecord:Math.round(bytes/Math.max(1,lines.length))},null,2))'
          rm -rf .data
