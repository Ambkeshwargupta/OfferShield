name: MCA national company index import

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "Use 1000 for an isolated staging test; use 0 to resume and publish the complete MCA snapshot"
        required: true
        default: "0"
        type: string
      reset_import:
        description: "Start a fresh source snapshot. The currently published index remains live until the new index passes validation."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 3 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/mca-refresh-index.flag"

permissions:
  contents: read

concurrency:
  group: offershield-mca-national-index-import
  cancel-in-progress: false

jobs:
  import-national-mca:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET_NAME: offershield-company-index
      # Push/scheduled refreshes always ingest a fresh full snapshot. Manual runs
      # can resume a checkpoint or explicitly request a fresh snapshot.
      MAX_RECORDS: ${{ inputs.max_records || '0' }}
      RESET_IMPORT: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.reset_import || inputs.max_records != '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate OGD and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in DATA_GOV_API_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Prepare bucket-scoped R2 S3 credentials
        id: r2creds
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(printenv AWS_ACCESS_KEY_ID || true)" ] && [ -n "$(printenv AWS_SECRET_ACCESS_KEY || true)" ]; then
            echo "Using existing R2 S3 credentials from repository secrets."
            echo "temporary=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/mca-create-r2-token.mjs
          fi

      - name: Install AWS CLI and verify the R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi
          aws --version
          aws s3api head-bucket \
            --bucket "$R2_BUCKET_NAME" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "R2 bucket is reachable. Raw ingestion and published index use separate prefixes."

      - name: Verify the official MCA OGD source before changing ingestion state
        run: node scripts/mca-api-check.mjs

      - name: Restore persistent MCA checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/mca/pages
          if [ "$RESET_IMPORT" = "true" ]; then
            echo "Starting a fresh source snapshot. Removing only ingestion/mca/; the published index/ remains untouched."
            aws s3 rm "s3://$R2_BUCKET_NAME/ingestion/mca/" --recursive \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto --only-show-errors
          elif aws s3 ls "s3://$R2_BUCKET_NAME/ingestion/mca/checkpoint.json" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" >/dev/null 2>&1; then
            aws s3 cp "s3://$R2_BUCKET_NAME/ingestion/mca/checkpoint.json" \
              ".data/mca/r2-checkpoint.json" \
              --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --region auto --only-show-errors --no-progress
          else
            echo "No existing R2 checkpoint. Starting at offset zero."
          fi

      - name: Download and persist MCA pages to R2
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MAX_RECORDS" = "0" ]; then
            node scripts/mca-download-r2.mjs --page-size=10000 --delay-ms=1000
          else
            node scripts/mca-download-r2.mjs --max-records="$MAX_RECORDS" --page-size=1000 --delay-ms=250
          fi

      - name: Restore all persisted MCA pages for index generation
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync "s3://$R2_BUCKET_NAME/ingestion/mca/pages/" ".data/mca/pages/" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto --only-show-errors --no-progress
          : > .data/mca/company-master.ndjson
          while IFS= read -r -d '' file; do
            gzip -cd "$file" >> .data/mca/company-master.ndjson
          done < <(find .data/mca/pages -type f -name 'page-*.ndjson.gz' -print0 | sort -z)
          node --input-type=module -e '
            import { createReadStream } from "node:fs";
            import readline from "node:readline";
            const { readFile } = await import("node:fs/promises");
            const checkpoint = JSON.parse(await readFile(".data/mca/r2-checkpoint.json", "utf8"));
            let rows = 0;
            for await (const line of readline.createInterface({ input:createReadStream(".data/mca/company-master.ndjson"), crlfDelay:Infinity })) {
              if (!line.trim()) continue;
              const row = JSON.parse(line);
              if (!row.cin || !row.name) throw new Error("Invalid normalized row in MCA snapshot.");
              rows++;
            }
            if (rows !== checkpoint.usableRecords) {
              throw new Error("Snapshot mismatch: assembled " + rows + " rows but checkpoint expects " + checkpoint.usableRecords + ".");
            }
            console.log(JSON.stringify({assembledRows:rows, downloadedRecords:checkpoint.downloadedRecords, sourceTotal:checkpoint.totalRecords, sourceUpdatedAt:checkpoint.sourceUpdatedAt, complete:checkpoint.complete}, null, 2));
          '

      - name: Build compressed token index and per-token manifests
        run: node scripts/mca-build-r2-index.mjs --shard-size=1000

      - name: Verify index coverage before publishing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const checkpoint = JSON.parse(await readFile(".data/mca/r2-checkpoint.json", "utf8"));
            const index = JSON.parse(await readFile(".data/mca/r2-index/index-manifest.json", "utf8"));
            if (index.importedCompanies !== checkpoint.usableRecords) {
              throw new Error("Index coverage does not match the persisted MCA snapshot.");
            }
            if (process.env.MAX_RECORDS === "0" && !checkpoint.complete) {
              throw new Error("Refusing to publish: the MCA snapshot is not complete. Run the workflow again to resume.");
            }
            console.log(JSON.stringify({
              importedCompanies:index.importedCompanies,
              sourceRecords:checkpoint.downloadedRecords,
              sourceTotal:checkpoint.totalRecords,
              tokenPostings:index.tokenPostings,
              uniqueTokens:index.uniqueTokens,
              shardCount:index.shardCount,
              manifestCount:index.tokenManifestCount,
              sourceUpdatedAt:index.sourceUpdatedAt,
              complete:checkpoint.complete
            }, null, 2));
          '

      - name: Publish complete index or isolated staging test
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MAX_RECORDS" = "0" ]; then
            TARGET_PREFIX="index/"
            echo "Publishing complete MCA index to index/."
          else
            TARGET_PREFIX="staging/index/"
            echo "Publishing capped test index to staging/index/. Production index is unchanged."
          fi
          aws s3 sync ".data/mca/r2-index/" "s3://$R2_BUCKET_NAME/$TARGET_PREFIX" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto --only-show-errors --no-progress --delete
          aws s3 cp ".data/mca/r2-index/index-manifest.json" "s3://$R2_BUCKET_NAME/$TARGET_PREFIX"index-manifest.json \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --region auto --only-show-errors --no-progress
          echo "Published manifest to s3://$R2_BUCKET_NAME/$TARGET_PREFIX"


      - name: Deploy updated intelligence Worker after full publication
        if: env.MAX_RECORDS == '0'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@latest
          printf '%s' "$DATA_GOV_API_KEY" | wrangler secret put DATA_GOV_API_KEY --config workers/wrangler.toml
          wrangler deploy --config workers/wrangler.toml

      - name: Verify the published R2 national index through the live Worker
        if: env.MAX_RECORDS == '0'
        shell: bash
        env:
          WORKER_URL: https://offershield-intelligence.official-ambkeshwargupta.workers.dev
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const checkpoint = JSON.parse(await readFile(".data/mca/r2-checkpoint.json", "utf8"));
            const manifest = JSON.parse(await readFile(".data/mca/r2-index/index-manifest.json", "utf8"));
            const expected = {
              importedCompanies:checkpoint.usableRecords,
              totalSourceRecords:checkpoint.totalRecords,
              sourceUpdatedAt:checkpoint.sourceUpdatedAt
            };
            let status = null;
            for (let attempt=0; attempt<12; attempt++) {
              try {
                const response = await fetch(process.env.WORKER_URL + "/v1/mca/index-status", {headers:{accept:"application/json"}});
                status = await response.json();
                if (response.ok && status.complete &&
                    status.importedCompanies === expected.importedCompanies &&
                    status.totalSourceRecords === expected.totalSourceRecords &&
                    status.sourceUpdatedAt === expected.sourceUpdatedAt) break;
              } catch {}
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            console.log(JSON.stringify({expected, published:status},null,2));
            if (!status?.complete ||
                status.importedCompanies !== expected.importedCompanies ||
                status.totalSourceRecords !== expected.totalSourceRecords ||
                status.sourceUpdatedAt !== expected.sourceUpdatedAt) {
              throw new Error("The Worker does not yet expose the complete, matching national MCA index.");
            }
            if (manifest.importedCompanies !== expected.importedCompanies) {
              throw new Error("Local index manifest differs from the downloaded source checkpoint.");
            }
          '

      - name: Report import result
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const checkpoint = JSON.parse(await readFile(".data/mca/r2-checkpoint.json", "utf8"));
            const index = JSON.parse(await readFile(".data/mca/r2-index/index-manifest.json", "utf8"));
            console.log(JSON.stringify({
              downloadedRecords:checkpoint.downloadedRecords,
              sourceTotal:checkpoint.totalRecords,
              complete:checkpoint.complete,
              importedCompanies:index.importedCompanies,
              tokenPostings:index.tokenPostings,
              uniqueTokens:index.uniqueTokens,
              shardCount:index.shardCount,
              tokenManifestCount:index.tokenManifestCount,
              sourceUpdatedAt:index.sourceUpdatedAt
            }, null, 2));
          '

      - name: Revoke temporary R2 token
        if: ${{ always() && steps.r2creds.outputs.temporary == 'true' && steps.r2creds.outputs.token_id != '' }}
        env:
          R2_TEMP_TOKEN_ID: ${{ steps.r2creds.outputs.token_id }}
        run: node scripts/mca-revoke-r2-token.mjs
